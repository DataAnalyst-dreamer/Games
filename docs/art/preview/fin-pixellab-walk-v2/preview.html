<!doctype html><html lang="ko"><meta charset="utf-8"><title>핀 걷기 · 어깨 교대 비교</title>
<style>body{background:#20342f;color:#eee;font:16px system-ui;margin:32px}section,#strip{display:flex;gap:24px;flex-wrap:wrap}figure{margin:8px}img{image-rendering:pixelated;width:264px;height:384px}#strip img{width:132px;height:192px}button,input{font:inherit;margin:10px}p{max-width:900px;line-height:1.6}</style>
<h1>핀 걷기 · 기존 / 어깨 교대 수정 시안</h1><p>왼쪽은 기존, 오른쪽은 수정 시안입니다. 두 영상은 같은 속도와 프레임 번호로 재생됩니다. 원본 0번과 생성 1~8번을 그대로 표시하며, 끝 자세가 같은 경우의 멈칫함도 확인할 수 있도록 프레임을 임의로 삭제하지 않았습니다. 게임에는 아직 교체하지 않았습니다.</p>
<section><figure><img id="old" src="../fin-pixellab-walk-v1/frame-0.png"><figcaption>기존 v1</figcaption></figure><figure><img id="new" src="frame-0.png"><figcaption>수정 v2</figcaption></figure></section>
<button id="play">일시정지</button><button id="step">한 프레임씩</button><label>속도<input id="fps" type="range" min="4" max="16" value="10"><span id="rate">10</span>fps</label><span id="frame">프레임 0</span>
<h2>수정 시안 전체 프레임</h2><div id="strip"></div>
<script>let i=0,running=true,last=0;const q=s=>document.querySelector(s);for(let n=0;n<9;n++){const f=document.createElement('figure'),im=new Image(),cap=document.createElement('figcaption');im.src=`frame-${n}.png`;im.alt=`수정 프레임 ${n}`;cap.textContent=n?'생성 '+n:'입력 원본';f.append(im,cap);q('#strip').append(f)}function step(){i=(i+1)%9;q('#old').src=`../fin-pixellab-walk-v1/frame-${i}.png`;q('#new').src=`frame-${i}.png`;q('#frame').textContent=`프레임 ${i}`}q('#play').onclick=()=>{running=!running;q('#play').textContent=running?'일시정지':'재생'};q('#step').onclick=()=>{running=false;q('#play').textContent='재생';step()};q('#fps').oninput=()=>q('#rate').textContent=q('#fps').value;function tick(t){if(running&&t-last>=1000/Number(q('#fps').value)){step();last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
