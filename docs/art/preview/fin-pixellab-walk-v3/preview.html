<!doctype html><html lang="ko"><meta charset="utf-8"><title>핀 v3 · 걷기 템플릿 테스트</title>
<style>body{margin:24px;background:#20342f;color:#eee;font:16px system-ui}p{max-width:1000px;line-height:1.6}button,input{font:inherit;margin:8px}section,#strip{display:flex;gap:24px;flex-wrap:wrap}figure{margin:8px}img{image-rendering:pixelated;width:272px;height:384px;object-fit:contain}#strip img{width:136px;height:192px}#stage{height:340px;max-width:900px;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,#314a40 0 47px,#4d6455 47px 48px)}#actor{position:absolute;width:136px;height:192px;left:calc(50% - 68px);top:30px}button{touch-action:none}#error{color:#ff9e95}</style>
<h1>핀 v3 · 걷기 템플릿 테스트</h1><p>새 walking 전용 템플릿 6프레임입니다. 외형과 모션은 생성 원본 그대로이며, 그림을 흔들거나 좌우 반전해서 움직임을 만들지 않았습니다. 아래 이동 시험은 정면만 지원합니다. 기존 게임은 교체하지 않았습니다.</p><p id="error"></p>
<section><figure><img id="old" src="../fin-pixellab-walk-v1/frame-1.png"><figcaption>v1 · 기존 자유문장 생성</figcaption></figure><figure><img id="new" src="frame-0.png"><figcaption>v3 · 걷기 전용 템플릿</figcaption></figure></section>
<button id="play">일시정지</button><button id="step">v3 한 프레임씩</button><label>v3 속도<input id="fps" type="range" min="4" max="14" value="8"><span id="rate">8</span>fps</label><span id="counter"></span>
<h2>정면 이동 시험</h2><p>S / ↓ 또는 아래 버튼을 누르고 있으면 핀이 앞으로 이동합니다. 손을 떼면 대기합니다. 비교 영상과 이동 시험은 독립적으로 동작합니다.</p><button id="walk">누르고 걷기</button><button id="reset">위치 초기화</button><div id="stage"><img id="actor" src="idle.png"></div>
<h2>6프레임 · 생성 순서 그대로</h2><div id="strip"></div>
<script>
const q=s=>document.querySelector(s),frames=Array.from({length:6},(_,i)=>`frame-${i}.png`);let ready=false;
Promise.all([...frames,'idle.png',...Array.from({length:8},(_,i)=>`../fin-pixellab-walk-v1/frame-${i+1}.png`)].map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=()=>reject(new Error(src));im.src=src}))).then(()=>ready=true).catch(e=>q('#error').textContent='이미지를 읽지 못했습니다: '+e.message);
frames.forEach((src,i)=>{const f=document.createElement('figure'),im=new Image(),c=document.createElement('figcaption');im.src=src;c.textContent='프레임 '+i;f.append(im,c);q('#strip').append(f)});
let running=true,t=0,prev=0,index=0,y=30,distance=0;const keys=new Set();let held=false;
function render(){q('#new').src=frames[index];q('#old').src=`../fin-pixellab-walk-v1/frame-${1+Math.floor((index/6)*8)}.png`;q('#counter').textContent=`v3 프레임 ${index} / 5`}
q('#play').onclick=()=>{running=!running;q('#play').textContent=running?'일시정지':'재생'};q('#step').onclick=()=>{running=false;q('#play').textContent='재생';index=(index+1)%6;render()};q('#fps').oninput=()=>q('#rate').textContent=q('#fps').value;
addEventListener('keydown',e=>{if(['s','S','ArrowDown'].includes(e.key)){keys.add(e.code);e.preventDefault()}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();held=false});q('#walk').onpointerdown=e=>{held=true;e.currentTarget.setPointerCapture(e.pointerId)};q('#walk').onpointerup=q('#walk').onpointercancel=()=>held=false;q('#reset').onclick=()=>{y=30;distance=0};
function tick(now){const dt=prev?Math.min((now-prev)/1000,.05):0;prev=now;if(ready){if(running){t+=dt;if(t>=1/Number(q('#fps').value)){t%=1/Number(q('#fps').value);index=(index+1)%6;render()}}if(held||keys.size){const travel=90*dt;y+=travel;distance+=travel;if(y>148)y=30;q('#actor').src=frames[Math.floor(distance/(90/Number(q('#fps').value)))%6]}else{distance=0;q('#actor').src='idle.png'}q('#actor').style.top=y+'px'}requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
</script></html>
